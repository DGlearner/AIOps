[project]
name = "crossst-agent"
version = "0.1.0"
description = "AIOps agent for multi-source log anomaly detection"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis[hiredis]==5.2.1",
  "aiokafka==0.12.0",
  "langchain==1.3.4",
  "langchain-openai==1.2.2",
  "langgraph==1.2.4",
  "python-dotenv==1.0.1",
  "pytest==8.3.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
