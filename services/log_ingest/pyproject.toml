[project]
name = "crossst-log-ingest"
version = "0.1.0"
description = "Standalone log ingest service for CrossST raw log streams"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "aiokafka==0.12.0",
  "python-dotenv==1.0.1",
  "websockets==15.0.1",
  "pytest==8.3.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
